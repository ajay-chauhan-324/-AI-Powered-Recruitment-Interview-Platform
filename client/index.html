<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Ledger — Intelligent Time Canvas</title>
    <script>
      // Runs before first paint so the correct theme applies with zero flash — React's
      // ThemeProvider (src/features/theme/) reads/writes the same 'theme' localStorage key
      // and only ever re-applies what this script already established.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored)
          }
          // 'system' (or no stored value) intentionally sets no attribute — the CSS
          // prefers-color-scheme media query alone decides, including live OS changes.
        } catch (error) {
          // localStorage can throw in locked-down environments (private browsing, etc.) —
          // fall back to system preference via CSS alone.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
